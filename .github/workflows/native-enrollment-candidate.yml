name: Native enrollment candidate

on:
  pull_request:
    paths:
      - .github/workflows/native-enrollment-candidate.yml
      - apps/server/src/jones/workstreams/enrollment/**
      - scripts/jones/native-enrollment/**
      - packages/shared/src/nodeSqliteClient*
      - apps/server/src/environment/NativeStoreAuthority*
      - apps/server/src/environment/nativeStoreAuthorityPersistence*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-enrollment-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Candidate Node 26.12.1 (${{ matrix.platform }}, ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
          - os: macos-15
            platform: darwin
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout public source
        shell: bash
        env:
          GITHUB_REPOSITORY: Jones-Systems/Jones-Code
          JONES_CHECKOUT_SHA: ${{ github.sha }}
          JONES_CHECKOUT_DEPTH: "1"
          JONES_CHECKOUT_CONE: "false"
          JONES_CHECKOUT_SPARSE: |
            /*
            !/.repos/
        run: |
          set -euo pipefail
          # Bootstrap is copied into checkout steps because repository source is not available yet.
          # anonymous-checkout.node-test.mjs binds every copy to this exact script.
          test "$GITHUB_REPOSITORY" = Jones-Systems/Jones-Code
          [[ "$JONES_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$JONES_CHECKOUT_DEPTH" in 0|1|2) ;; *) exit 2 ;; esac
          case "$JONES_CHECKOUT_CONE" in true|false) ;; *) exit 2 ;; esac
          test ! -L "$GITHUB_WORKSPACE"
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          shopt -s nullglob dotglob
          checkout_entries=("$GITHUB_WORKSPACE"/*)
          test "${#checkout_entries[@]}" -eq 0
          unset GIT_CONFIG_PARAMETERS GIT_CONFIG GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_REPLACE_REF_BASE GIT_SHALLOW_FILE
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=0
          export GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=never GIT_ASKPASS=/bin/false SSH_ASKPASS=/bin/false
          git init .
          git remote add origin https://github.com/Jones-Systems/Jones-Code.git
          if test "$JONES_CHECKOUT_CONE" = true; then
            git sparse-checkout init --cone
            printf '%s\n' "$JONES_CHECKOUT_SPARSE" | git sparse-checkout set --cone --stdin
          else
            git sparse-checkout init --no-cone
            printf '%s\n' "$JONES_CHECKOUT_SPARSE" | git sparse-checkout set --no-cone --stdin
          fi
          if test "$JONES_CHECKOUT_DEPTH" = 0; then
            git -c protocol.version=2 -c credential.helper= -c core.askPass=/bin/false fetch --tags origin '+refs/heads/*:refs/remotes/origin/*' "$JONES_CHECKOUT_SHA"
          else
            git -c protocol.version=2 -c credential.helper= -c core.askPass=/bin/false fetch --no-tags --depth="$JONES_CHECKOUT_DEPTH" origin "$JONES_CHECKOUT_SHA"
          fi
          git checkout --detach "$JONES_CHECKOUT_SHA"
          test "$(git rev-parse HEAD)" = "$JONES_CHECKOUT_SHA"

      - name: Install on the supported development runtime
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      - name: Select the exact candidate runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1

      - name: Allocate qualification scratch
        id: scratch
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/jones-native-candidate-XXXXXX")
          echo "path=$scratch" >> "$GITHUB_OUTPUT"
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"

      - name: Verify runtime identity
        env:
          QUALIFICATION_PLATFORM: ${{ matrix.platform }}
          QUALIFICATION_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.versions.node, '26.12.1');
          assert.equal(process.versions.sqlite, '3.54.0');
          assert.equal(process.platform, process.env.QUALIFICATION_PLATFORM);
          assert.equal(process.arch, process.env.QUALIFICATION_ARCHITECTURE);
          NODE

      - name: Exercise candidate SQLite and real transaction authority
        run: |
          qualification_runner=$(node -e 'const r = require("node:module").createRequire(require.resolve("vite-plus/package.json")); const p = r.resolve("vitest/package.json"); console.log(require("node:path").resolve(require("node:path").dirname(p), r(p).bin.vitest));')
          node "$qualification_runner" run --config scripts/jones/native-enrollment/candidate.vite.config.ts

      - name: Build disposable SEA fixture
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          fs.writeFileSync(path.join(process.env.TMPDIR, 'sea.json'), JSON.stringify({
            main: path.resolve('scripts/jones/native-enrollment/sea-fixture.cjs'),
            mainFormat: 'commonjs',
            output: path.join(process.env.TMPDIR, 'sqlite-sea'),
            useCodeCache: false,
            useSnapshot: false,
            disableExperimentalSEAWarning: true,
          }));
          NODE
          node --build-sea "$TMPDIR/sea.json"
          if [[ "$RUNNER_OS" == macOS ]]; then codesign --force --sign - "$TMPDIR/sqlite-sea"; fi

      - name: Exercise SEA SQLite and fixture cleanup
        run: JONES_SQLITE_SEA_FIXTURE="$TMPDIR/sqlite-sea" node --test scripts/jones/native-enrollment/sea-fixture.node-test.mjs

      - name: Remove exact qualification scratch
        if: always() && steps.scratch.outcome == 'success'
        env:
          QUALIFICATION_SCRATCH: ${{ steps.scratch.outputs.path }}
        run: rm -rf -- "$QUALIFICATION_SCRATCH"
