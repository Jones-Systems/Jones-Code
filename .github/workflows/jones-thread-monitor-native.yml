name: Jones thread monitor native smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/jones-thread-monitor-native.yml
      - apps/desktop/scripts/jones-thread-monitor-mac-smoke*
      - apps/desktop/scripts/ui-evidence/scenario-api.mjs
      - apps/desktop/scripts/ui-evidence/main-window.mjs
      - apps/desktop/scripts/ui-evidence/provenance.mjs
      - apps/desktop/src/jones/threadMonitor/**
      - apps/desktop/src/electron/ElectronWindow.ts
      - apps/desktop/src/electron/ElectronProtocol.ts
      - apps/desktop/src/window/DesktopWindow.ts
      - apps/desktop/src/main.ts
      - apps/desktop/src/ipc/DesktopIpc.ts
      - apps/desktop/src/ipc/DesktopIpcHandlers.ts
      - apps/desktop/src/app/DesktopApp.ts
      - apps/desktop/src/app/DesktopLifecycle.ts
      - apps/desktop/src/preview/Manager.ts
      - apps/desktop/src/preload.ts
      - apps/desktop/vite.config.ts
      - apps/web/src/jones/threadMonitor/**
      - apps/web/src/AppRoot.tsx
      - apps/web/src/connection/platform.ts
      - apps/web/src/lib/backgroundActivityReporter.ts
      - apps/web/src/components/chat/useProposedPlanSend.ts
      - apps/web/src/components/chat/PanelLayoutControls.tsx
      - apps/web/src/components/ChatView.tsx
      - apps/web/src/components/RightPanelTabs.tsx
      - apps/web/src/components/WorkspacePageHeader.tsx
      - apps/web/src/components/pullRequest/PullRequestsPage.tsx
      - apps/web/thread-monitor.html
      - apps/web/vite.config.ts
      - packages/contracts/src/jones/desktopThreadMonitor*
      - packages/contracts/src/jones/guardedThreadSettlement*
      - packages/contracts/src/ipc.ts
      - packages/contracts/src/environment.ts
      - packages/contracts/src/orchestrationV2.ts
      - packages/contracts/src/index.ts
      - packages/contracts/package.json
      - packages/client-runtime/src/jones/threadMonitor/**
      - packages/client-runtime/src/operations/commands.ts
      - packages/client-runtime/package.json
      - apps/server/src/jones/threadMonitor/**
      - apps/server/src/environment/ServerEnvironment.ts
      - apps/server/src/orchestration-v2/Orchestrator.ts

permissions:
  contents: read

concurrency:
  group: jones-thread-monitor-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac-smoke:
    name: macOS thread monitor native evidence (advisory)
    if: >-
      github.repository == 'Jones-Systems/Jones-Code' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      JONES_MONITOR_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      T3CODE_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      T3CODE_DISABLE_AUTO_UPDATE: "true"
      T3CODE_DEV_SEED: "0"
    steps:
      - name: Checkout exact public feature head
        shell: bash
        env:
          GITHUB_REPOSITORY: Jones-Systems/Jones-Code
          JONES_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JONES_CHECKOUT_DEPTH: "1"
          JONES_CHECKOUT_CONE: "false"
          JONES_CHECKOUT_SPARSE: |
            /*
            !/.repos/
        run: |
          set -euo pipefail
          # Bootstrap is copied into checkout steps because repository source is not available yet.
          # anonymous-checkout.node-test.mjs binds every copy to this exact script.
          test "$GITHUB_REPOSITORY" = Jones-Systems/Jones-Code
          [[ "$JONES_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$JONES_CHECKOUT_DEPTH" in 0|1|2) ;; *) exit 2 ;; esac
          case "$JONES_CHECKOUT_CONE" in true|false) ;; *) exit 2 ;; esac
          test ! -L "$GITHUB_WORKSPACE"
          test "$(pwd -P)" = "$GITHUB_WORKSPACE"
          shopt -s nullglob dotglob
          checkout_entries=("$GITHUB_WORKSPACE"/*)
          test "${#checkout_entries[@]}" -eq 0
          unset GIT_CONFIG_PARAMETERS GIT_CONFIG GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_REPLACE_REF_BASE GIT_SHALLOW_FILE
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=0
          export GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=never GIT_ASKPASS=/bin/false SSH_ASKPASS=/bin/false
          git init .
          git remote add origin https://github.com/Jones-Systems/Jones-Code.git
          if test "$JONES_CHECKOUT_CONE" = true; then
            git sparse-checkout init --cone
            printf '%s\n' "$JONES_CHECKOUT_SPARSE" | git sparse-checkout set --cone --stdin
          else
            git sparse-checkout init --no-cone
            printf '%s\n' "$JONES_CHECKOUT_SPARSE" | git sparse-checkout set --no-cone --stdin
          fi
          if test "$JONES_CHECKOUT_DEPTH" = 0; then
            git -c protocol.version=2 -c credential.helper= -c core.askPass=/bin/false fetch --tags origin '+refs/heads/*:refs/remotes/origin/*' "$JONES_CHECKOUT_SHA"
          else
            git -c protocol.version=2 -c credential.helper= -c core.askPass=/bin/false fetch --no-tags --depth="$JONES_CHECKOUT_DEPTH" origin "$JONES_CHECKOUT_SHA"
          fi
          git checkout --detach "$JONES_CHECKOUT_SHA"
          test "$(git rev-parse HEAD)" = "$JONES_CHECKOUT_SHA"

      - name: Record exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JONES_MONITOR_SOURCE_SHA"
          printf 'JONES_MONITOR_SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Setup pinned Node, pnpm and Vite+
        uses: voidzero-dev/setup-vp@8a7496fd44e8a1b0a88a7459e36213b2fefc1d15
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check smoke child environment boundary
        run: node --test --test-concurrency=1 apps/desktop/scripts/jones-thread-monitor-mac-smoke.test.mjs apps/desktop/scripts/ui-evidence/main-window.test.mjs

      - name: Check native producer identity
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { producerIdentity, observeProducerSelf } from "./apps/server/src/jones/workspaceRetirement/ProducerSessionObservation.ts";
          assert.equal(process.platform, "darwin");
          assert.equal(process.arch, "arm64");
          const preparationStarted = performance.now();
          execFileSync("/usr/bin/python3", ["-B", "-c", "import ctypes; ctypes.CDLL('/usr/lib/libproc.dylib')"], {
            timeout: 15_000,
            env: { PATH: "/usr/bin:/bin", LC_ALL: "C" },
            stdio: "inherit",
          });
          console.log(`System Python preparation: ${Math.round(performance.now() - preparationStarted)}ms`);
          const identity = await producerIdentity();
          assert.equal(identity.pid, process.pid);
          assert.match(identity.start, /^[0-9]+:[0-9]+$/);
          assert.deepEqual(await observeProducerSelf(identity), { state: "present", reason: "holder_present" });
          JS

      - name: Build affected desktop and server renderer
        run: vp run build:desktop

      - name: Exercise actual native windows with synthetic state
        run: node apps/desktop/scripts/jones-thread-monitor-mac-smoke.mjs

      - name: Upload synthetic native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: thread-monitor-mac-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/thread-monitor-mac/
          if-no-files-found: warn
          retention-days: 7
