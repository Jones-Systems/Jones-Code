name: Server parallel qualification

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Bounded source evidence first; full matrix after prerequisite review
        type: choice
        options: [source-evidence, full, observer-diagnostic, observer-control]
        default: source-evidence
      observer_full_artifact:
        description: Inspected full diagnostic artifact name; required only for the one optional control
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/server-parallel-qualification.yml
      - apps/server/src/jones/serverParallelism/**
      - apps/server/src/jones/serverCompute/**
      - apps/server/src/jones/workspace/**
      - apps/server/src/workspace/WorkspaceSearchIndex.ts
      - apps/server/src/workspace/WorkspaceEntries.ts
      - apps/server/src/persistence/Sqlite.ts
      - apps/server/src/orchestration-v2/EffectWorker.ts
      - apps/server/src/orchestration-v2/ProjectionStore.ts
      - apps/server/src/bin.ts
      - apps/server/src/server.ts
      - apps/server/vite.config.ts
      - apps/server/scripts/cli.ts
      - packages/shared/src/jones/sqliteReaders/**
      - packages/shared/src/jones/sqliteReaderContracts.ts
      - packages/shared/src/nodeSqliteClient.ts
      - scripts/jones/serverParallelism/**
      - scripts/build-cli-archive.ts
      - scripts/lib/cli-external-packages.ts
      - patches/@ff-labs__fff-node@0.11.0.patch
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: server-parallel-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Server parallel (${{ matrix.os }})
    if: github.repository == 'Jones-Systems/Jones-Code'
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON((github.event.inputs.scope == 'observer-diagnostic' || github.event.inputs.scope == 'observer-control') && '[{"os":"linux","runner":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-gnu","resource_key":"linux-x64","archive_platform":"linux","arch":"x64"}]' || '[{"os":"linux","runner":"ubuntu-24.04","rust_target":"x86_64-unknown-linux-gnu","resource_key":"linux-x64","archive_platform":"linux","arch":"x64"},{"os":"macos","runner":"macos-15","rust_target":"aarch64-apple-darwin","resource_key":"darwin-arm64","archive_platform":"mac","arch":"arm64"}]') }}
    defaults:
      run:
        shell: bash
    env:
      # One serial qualification lane per OS shares setup and all build outputs.
      T3CODE_DEV_SEED: "0"
      VP_NODE_VERSION: "26.12.1"
      JONES_SP_SCOPE: ${{ github.event.inputs.scope || 'source-evidence' }}
    steps:
      - name: Checkout exact public source without vendored gitlinks
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/Jones-Systems/Jones-Code.git
          git sparse-checkout init --no-cone
          printf '%s\n' '/*' '!/.repos/' | git sparse-checkout set --no-cone --stdin
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Admit job storage and create owned scratch
        id: scratch
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP/jones-server-parallel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          JONES_SP_REPORTS="$RUNNER_TEMP/jones-server-parallel-reports-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export TMPDIR JONES_SP_REPORTS
          printf '%s\n' "TMPDIR=$TMPDIR" "JONES_SP_REPORTS=$JONES_SP_REPORTS" >> "$GITHUB_ENV"
          mkdir -m 700 -p "$TMPDIR" "$JONES_SP_REPORTS"
          test ! -L "$TMPDIR"
          test ! -L "$JONES_SP_REPORTS"
          printf '%s\n' "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" > "$TMPDIR/OWNER"
          printf '%s\n' "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" > "$JONES_SP_REPORTS/OWNER"
          printf 'scratch=%s\nreports=%s\nowned=true\n' "$TMPDIR" "$JONES_SP_REPORTS" >> "$GITHUB_OUTPUT"
          node scripts/jones/serverParallelism/storage.mjs "$GITHUB_WORKSPACE" > "$JONES_SP_REPORTS/storage-install.json"
          node scripts/jones/serverParallelism/storage.mjs "$TMPDIR" > "$JONES_SP_REPORTS/storage-scratch.json"
          git rev-parse HEAD > "$JONES_SP_REPORTS/SOURCE_COMMIT"

      - name: Setup pinned Node and Vite+
        id: setup
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/desktop...

      - name: Setup archive resource-monitor toolchain
        if: env.JONES_SP_SCOPE == 'full'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Ensure pinned Electron Node runtime
        if: env.JONES_SP_SCOPE == 'full'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Focused qualification regressions and control/checkpoint invariants
        run: >-
          vp test run --maxWorkers=1
          apps/server/src/jones/serverParallelism/diagnosticObservation.test.ts
          apps/server/src/jones/serverParallelism/resourceSamples.test.ts
          apps/server/src/jones/serverParallelism/qualificationRetention.test.ts
          apps/server/src/jones/serverParallelism/nativeGenerationEvidence.test.ts
          apps/server/src/jones/serverParallelism/combinedQualification.integration.test.ts
          apps/server/src/jones/serverParallelism/nativeThreadBudget.test.ts
          apps/server/src/jones/serverParallelism/controlProgress.integration.test.ts
          apps/server/src/jones/serverParallelism/shellCapture.integration.test.ts
          apps/server/src/jones/serverParallelism/composition.test.ts
          apps/server/src/jones/workspace/nativeSearchRuntime.test.ts
          apps/server/src/jones/workspace/contentSearchPages.test.ts
          apps/server/src/jones/serverCompute/worker.test.ts
          apps/server/src/jones/serverCompute/workerCommand.test.ts
          apps/server/src/jones/serverCompute/guardian.test.ts
          apps/server/src/jones/serverCompute/processSlot.test.ts
          apps/server/src/jones/serverCompute/journal.test.ts
          apps/server/src/jones/serverCompute/residency.test.ts
          apps/server/src/jones/serverCompute/supervisor.test.ts
          packages/shared/src/jones/sqliteReaders/checkpoint.test.ts
          packages/shared/src/jones/sqliteReaders/lifecycle.test.ts

      - name: Build one bundle and actual installed SEA layout
        id: build
        if: env.JONES_SP_SCOPE == 'full'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          RESOURCE_KEY: ${{ matrix.resource_key }}
          ARCHIVE_PLATFORM: ${{ matrix.archive_platform }}
          ARCHIVE_ARCH: ${{ matrix.arch }}
          JONES_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/jones/serverParallelism/storage.mjs "$GITHUB_WORKSPACE" > "$JONES_SP_REPORTS/storage-build.json"
          cp .env.example .env
          base=$(node -p "require('./apps/server/package.json').version.split('-')[0]")
          version="${base}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          node scripts/update-release-package-versions.ts "$version"
          node scripts/stamp-jones-build.ts
          vp run --filter t3 build
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"
          mkdir -p "$TMPDIR/resource-monitor/$RESOURCE_KEY"
          cp "native/resource-monitor/target/$RUST_TARGET/release/t3-resource-monitor" "$TMPDIR/resource-monitor/$RESOURCE_KEY/"
          node scripts/jones/serverParallelism/storage.mjs "$GITHUB_WORKSPACE" > "$JONES_SP_REPORTS/storage-archive.json"
          node scripts/build-cli-archive.ts --platform "$ARCHIVE_PLATFORM" --arch "$ARCHIVE_ARCH" \
            --version "$version" --resource-monitor-dir "$TMPDIR/resource-monitor" --output-dir "$TMPDIR/archive"
          archives=("$TMPDIR"/archive/*.tar.gz)
          test "${#archives[@]}" -eq 1
          mkdir "$TMPDIR/installed"
          tar -xzf "${archives[0]}" -C "$TMPDIR/installed"

      - name: Fetch the separately inspected full diagnostic for one optional control
        if: env.JONES_SP_SCOPE == 'observer-control'
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_ARTIFACT: ${{ github.event.inputs.observer_full_artifact }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$FULL_ARTIFACT" =~ ^server-parallel-linux-([0-9]+)-([0-9]+)$ ]]
          full_run="${BASH_REMATCH[1]}"
          test "$full_run" != "$GITHUB_RUN_ID"
          mkdir "$TMPDIR/observer-prior"
          gh run download "$full_run" --repo "$GITHUB_REPOSITORY" --name "$FULL_ARTIFACT" --dir "$TMPDIR/observer-prior"
          test -f "$TMPDIR/observer-prior/observer-full.json"
          test -f "$TMPDIR/observer-prior/baseline-laptop.json"

      - name: Measure selected qualification scope serially
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR/installed"
          if [[ "$JONES_SP_SCOPE" == observer-control ]]; then
            node scripts/jones/serverParallelism/ci-run.mjs "$JONES_SP_REPORTS" "$TMPDIR/installed" "$JONES_SP_SCOPE" "$TMPDIR/observer-prior"
          else
            node scripts/jones/serverParallelism/ci-run.mjs "$JONES_SP_REPORTS" "$TMPDIR/installed" "$JONES_SP_SCOPE"
          fi

      - name: Preserve original outcomes, manifests, build identities and missing evidence
        if: ${{ always() && steps.scratch.outputs.owned == 'true' && steps.scratch.outputs.reports != '' && steps.scratch.outputs.scratch != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-parallel-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.scratch.outputs.reports }}/
            ${{ steps.scratch.outputs.scratch }}/**/journal/**
          if-no-files-found: error
          retention-days: 7

      - name: Remove only this job's scratch and finished build outputs
        if: ${{ always() && steps.scratch.outputs.owned == 'true' }}
        env:
          EXPECTED_OWNER: ${{ github.run_id }}.${{ github.run_attempt }}
          JOB_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          parent = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          scratch = pathlib.Path(os.environ['TMPDIR'])
          if scratch.parent != parent or scratch.is_symlink():
              raise RuntimeError('Unexpected qualification scratch')
          if scratch.exists():
              if (scratch / 'OWNER').read_text().strip() != os.environ['EXPECTED_OWNER']:
                  raise RuntimeError('Qualification ownership mismatch')
              report = pathlib.Path(os.environ['JONES_SP_REPORTS']) / 'qualification.json'
              evidence = json.loads(report.read_text()) if report.exists() else {}
              if os.environ['JOB_CANCELLED'] == 'true' or evidence.get('predicates', {}).get('cleanupProved') is not True:
                  print('Retaining this exact job scratch/builds until ephemeral runner teardown: process retirement is unproved. Journal evidence was uploaded first.')
                  raise SystemExit(0)
              shutil.rmtree(scratch)
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          for relative in ['apps/server/dist', 'apps/server/dist-exe', 'apps/web/dist', 'native/resource-monitor/target']:
              target = root / relative
              if target.is_symlink():
                  raise RuntimeError('Build output replaced by symlink')
              if target.exists():
                  shutil.rmtree(target)
          PY
