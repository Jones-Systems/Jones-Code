name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual runs compare server shard counts against a fixed weights source.
  workflow_dispatch:
    inputs:
      server_shards:
        description: Number of server test shards
        type: choice
        options:
          - "6"
          - "8"
        default: "6"
      weights_source_run_id:
        description: CI run whose combined server shard weights to use (default newest main push)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, typecheck, and the desktop build each get a runner so they run side by
  # side instead of one after another. The `Check` job at the end of this file
  # passes only when every other job does.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Verify Jones boundary accounting
        run: node scripts/jones/check-boundary.ts --strict --json

      - name: Check generated Expo GraphQL operations
        run: vp run --filter t3 generate --check

      - name: Check
        run: vp check

      - name: Capture formatting repair patch
        if: failure()
        run: |
          vp fmt
          git diff --binary > "${{ runner.temp }}/formatting-repair.patch"

      - name: Upload formatting repair patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formatting-repair
          path: ${{ runner.temp }}/formatting-repair.patch
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck
        run: vpr typecheck

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Server and web tests have their own jobs. Run client-runtime after the
  # parallel package batch: its generated-snapshot test exceeded its timeout
  # when competing with other suites on the hosted runner.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # ACP process-tree live tests compile a small pthread fixture with `cc`
      # and soft-skip when it is missing. Install build-essential so that path
      # always runs in CI instead of silently no-oping.
      - name: Install C toolchain for process-tree fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          command -v cc

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      # electron's install.js (run by ensure:electron) reads this cache before it
      # downloads from GitHub. The key changes only with the Electron version.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs

      - name: Test Vercel deployment output for enabled workflows
        run: |
          if test -f .github/workflows/release.yml && test -f .github/workflows/web-preview.yml; then
            node --test .github/scripts/vercel-deployment-output.test.cjs
          else
            echo "Vercel deployment integration: not applicable while Jones release and preview workflows are disabled."
          fi

      - name: Test process placement build custody
        run: node --test native/process-placement/build.test.mjs

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' --filter '!@t3tools/client-runtime' test

      - name: Test client-runtime
        run: vp run --filter @t3tools/client-runtime test

  # The web suite is the largest outside the server. In the shared Test job it
  # started last and ran alone for about 40s after everything else finished.
  test_web:
    name: Test Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      # The browser project runs React tests in headless Chromium. Same cache key as
      # test_server, so both jobs share one downloaded browser.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter @t3tools/web test

  # Picks the server shard weights once for the whole run, so every shard splits
  # the same file list the same way. It reads the combined weights that the
  # newest successful main push uploaded and otherwise keeps the checked-in map;
  # it fails only when a manual run names a source that cannot be used.
  server_weights:
    name: Server Weights
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
      digest: ${{ steps.select.outputs.digest }}
      weights: ${{ steps.select.outputs.weights }}
      shards: ${{ steps.select.outputs.shards }}
      shard_count: ${{ steps.select.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            /scripts/jones/server-shard-weights/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: false
          run-install: false

      - name: Select server shard weights
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SERVER_SHARDS: ${{ inputs.server_shards }}
          INPUT_WEIGHTS_SOURCE_RUN_ID: ${{ inputs.weights_source_run_id }}
        run: node scripts/jones/server-shard-weights/select.ts

  # apps/server sets `fileParallelism: false`, so its test files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly. The shards
  # split files by recorded duration (apps/server/src/testUtils/weightedShardSequencer.ts),
  # using the weights `server_weights` picked, and each records its own timings.
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: server_weights
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.server_weights.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      # Every shard must use the same weights, so a map that fails its digest
      # fails the shard rather than falling back on its own.
      - name: Load server shard weights
        env:
          WEIGHTS_MODE: ${{ needs.server_weights.outputs.mode }}
          WEIGHTS: ${{ needs.server_weights.outputs.weights }}
          WEIGHTS_DIGEST: ${{ needs.server_weights.outputs.digest }}
          WEIGHTS_SOURCE_RUN_ID: ${{ needs.server_weights.outputs.source_run_id }}
        run: |
          set -euo pipefail
          case "$WEIGHTS_MODE" in
            checked-in)
              echo "Using the checked-in server shard weights."
              ;;
            runtime)
              path="$RUNNER_TEMP/server-shard-weights.json"
              # The step output drops the file's final newline.
              printf '%s\n' "$WEIGHTS" > "$path"
              actual="$(sha256sum "$path" | cut -d ' ' -f 1)"
              if [[ "$actual" != "$WEIGHTS_DIGEST" ]]; then
                echo "Server shard weights hash to $actual, expected $WEIGHTS_DIGEST." >&2
                exit 1
              fi
              {
                echo "JONES_SERVER_SHARD_WEIGHTS_PATH=$path"
                echo "JONES_SERVER_SHARD_WEIGHTS_DIGEST=$WEIGHTS_DIGEST"
                echo "JONES_SERVER_SHARD_WEIGHTS_SOURCE_RUN_ID=$WEIGHTS_SOURCE_RUN_ID"
              } >> "$GITHUB_ENV"
              echo "Using server shard weights from run $WEIGHTS_SOURCE_RUN_ID ($WEIGHTS_DIGEST)."
              ;;
            *)
              echo "Unknown server shard weights mode: $WEIGHTS_MODE" >&2
              exit 1
              ;;
          esac

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
          JONES_SERVER_SHARD_TIMINGS_PATH: ${{ runner.temp }}/server-timings.ndjson
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=github-actions --reporter=../../scripts/jones/ci-test-progress-reporter.ts

      # Uploaded even when the shard fails, so partial timings stay inspectable.
      # The attempt and shard in the name keep reruns and shards apart.
      - name: Upload server shard timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-timings-a${{ github.run_attempt }}-s${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ runner.temp }}/server-timings.ndjson
          if-no-files-found: warn
          retention-days: 7

      # integration/transferBudgetV2.integration.test.ts writes the report; exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run for the transfer-report job.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  transfer-report:
    name: Transfer report artifact
    needs: test_server
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require transfer measurements
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer

  # Combines the server shards' timings into one weights file for later runs to
  # use. A run whose server tests did not all pass, or a rerun of only some
  # shards, is not a measurement. Passing shards whose timings fail validation
  # fail this job.
  server_timings:
    name: Server Timings
    needs: [server_weights, test_server]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /package.json
            /scripts/jones/server-shard-weights/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: false
          run-install: false

      # The combine step decides whether every shard arrived, so a failed
      # download leaves that judgement to it.
      - name: Download server shard timings
        if: needs.test_server.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: server-timings-a${{ github.run_attempt }}-s*-of-${{ needs.server_weights.outputs.shard_count }}
          path: ${{ runner.temp }}/server-timings

      - name: Combine server shard timings
        id: combine
        env:
          TEST_SERVER_RESULT: ${{ needs.test_server.result }}
          SHARD_COUNT: ${{ needs.server_weights.outputs.shard_count }}
          WEIGHTS_MODE: ${{ needs.server_weights.outputs.mode }}
          WEIGHTS_DIGEST: ${{ needs.server_weights.outputs.digest }}
          WEIGHTS_SOURCE_RUN_ID: ${{ needs.server_weights.outputs.source_run_id }}
          CAPTURES_DIR: ${{ runner.temp }}/server-timings
          WEIGHTS_OUT: ${{ runner.temp }}/server-shard-weights.json
        run: node scripts/jones/server-shard-weights/aggregate-cli.ts

      # Main pushes are the only runs later runs read weights from.
      - name: Upload server shard weights
        if: steps.combine.outputs.eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: server-shard-weights-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/server-shard-weights.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 30 || 7 }}

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  # The static analysis below needs a macOS runner, so gate it on the native
  # sources it actually lints. Detection is API-only (no checkout) and fails open: if
  # the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            stack_base=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.stack.base.ref // empty') \
              || fail_open "Could not read native stack membership."
            if [[ -n "$stack_base" ]]; then
              fail_open "Native stack qualification covers lower layers as well as this PR."
            fi
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: mobile_native_changes
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it.
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  native_enrollment_qualification:
    name: Native Enrollment (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
            node: "24.22.1"
            sqlite: "3.53.4"
          - os: macos-15
            platform: darwin
            architecture: arm64
            node: "24.22.1"
            sqlite: "3.53.4"
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
            node: "26.8.2"
            sqlite: "3.53.4"
          - os: macos-15
            platform: darwin
            architecture: arm64
            node: "26.8.2"
            sqlite: "3.53.4"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install dependencies on the supported development runtime
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: true

      - name: Setup the standalone CLI runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Qualify native enrollment and store authority on the actual runtime
        env:
          JONES_NATIVE_ENROLLMENT_QUALIFICATION_NODE: ${{ matrix.node }}
          JONES_NATIVE_ENROLLMENT_QUALIFICATION_SQLITE: ${{ matrix.sqlite }}
          QUALIFICATION_PLATFORM: ${{ matrix.platform }}
          QUALIFICATION_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          qualification_node="$(command -v node)"
          "$qualification_node" --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { lstatSync, realpathSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, parse, sep } from 'node:path';
          assert.equal(process.versions.node, process.env.JONES_NATIVE_ENROLLMENT_QUALIFICATION_NODE);
          assert.equal(process.versions.sqlite, process.env.JONES_NATIVE_ENROLLMENT_QUALIFICATION_SQLITE);
          assert.equal(process.platform, process.env.QUALIFICATION_PLATFORM);
          assert.equal(process.arch, process.env.QUALIFICATION_ARCHITECTURE);
          console.log({ node: process.versions.node, sqlite: process.versions.sqlite, executable: realpathSync(process.execPath), platform: process.platform, architecture: process.arch });
          const temporaryRoot = tmpdir();
          const ancestors = [];
          let current = parse(temporaryRoot).root;
          for (const part of temporaryRoot.slice(current.length).split(sep).filter(Boolean)) {
            current = join(current, part);
            const stat = lstatSync(current);
            ancestors.push({ path: current, symlink: stat.isSymbolicLink(), directory: stat.isDirectory() });
          }
          console.log({ temporaryRoot, canonicalTemporaryRoot: realpathSync(temporaryRoot), ancestors });
          NODE
          # Invoke the installed JS runner directly so vp cannot select the development Node version.
          qualification_runner="$("$qualification_node" -e 'const r = require("node:module").createRequire(require.resolve("vite-plus/package.json")); const p = r.resolve("vitest/package.json"); console.log(require("node:path").resolve(require("node:path").dirname(p), r(p).bin.vitest));')"
          "$qualification_node" "$qualification_runner" run \
            apps/server/src/jones/workstreams/enrollment/ \
            apps/server/src/environment/NativeStoreAuthority.test.ts \
            apps/server/src/environment/nativeStoreAuthorityPersistence.test.ts \
            packages/shared/src/nodeSqliteClient.test.ts

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26.12.1
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # Branch protection requires this job by its name, `Check`. It fails when any
  # other job fails, is cancelled, or is skipped without a reason, so splitting
  # or resharding jobs needs no ruleset change. Add every new job to `needs`.
  # `always()` rather than `!cancelled()`: a skipped job reports success to
  # branch protection, so a cancelled run must still produce a failing check.
  check:
    name: Check
    if: ${{ always() }}
    needs:
      [
        lint,
        typecheck,
        build,
        test,
        test_web,
        server_weights,
        test_server,
        transfer-report,
        server_timings,
        rust,
        mobile_native_changes,
        mobile_native_static_analysis,
        release_smoke,
        native_enrollment_qualification,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Only the macOS lint skips on purpose, when no native mobile code changed.
          echo "$RESULTS" | jq -e 'all(to_entries[];
            .value.result == "success"
            or (.key == "mobile_native_static_analysis" and .value.result == "skipped"))' > /dev/null
