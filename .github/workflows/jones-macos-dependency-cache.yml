name: Rotate macOS dependency cache

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: jones-macos-dependency-cache
  cancel-in-progress: false

jobs:
  rotate:
    if: >-
      github.repository == 'Jones-Systems/Jones-Code' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the current main archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$QUALIFIED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          repository="repos/$GITHUB_REPOSITORY"
          ref=refs/heads/main
          prefix=vite-plus-macOS-arm64-pnpm-
          main_head() {
            gh api "$repository/git/ref/heads/main" --jq .object.sha
          }
          if [[ "$(main_head)" != "$QUALIFIED_HEAD" ]]; then
            echo "Main advanced. Leave rotation to its next successful CI run."
            exit 0
          fi

          # setup-vp uses Actions hashFiles, which hashes the binary SHA-256
          # digest of the single lockfile again to build the primary key.
          lock_hash="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "$repository/contents/pnpm-lock.yaml?ref=$QUALIFIED_HEAD" \
            | python3 -c 'import hashlib, sys; print(hashlib.sha256(hashlib.sha256(sys.stdin.buffer.read()).digest()).hexdigest())')"
          current_key="$prefix$lock_hash"
          archives="$(gh api --method GET --paginate --slurp "$repository/actions/caches" \
            -f ref="$ref" -f key="$prefix" -F per_page=100)"
          candidates="$(jq -r --arg ref "$ref" --arg prefix "$prefix" --arg key "$current_key" '
            [.[].actions_caches[] | select(.ref == $ref and
              (.key | startswith($prefix)) and
              (.key | ltrimstr($prefix) | test("^[0-9a-f]{64}$")) and
              (.id | type == "number") and .size_in_bytes > 0)] as $scoped |
            if any($scoped[]; .key == $key) then
              $scoped[] | select(.key != $key) | .id
            else empty end
          ' <<< "$archives")"
          if [[ -z "$candidates" ]]; then
            echo "No superseded archive with a verified replacement."
            exit 0
          fi
          while IFS= read -r cache_id; do
            [[ "$cache_id" =~ ^[0-9]+$ ]]
            if [[ "$(main_head)" != "$QUALIFIED_HEAD" ]]; then
              echo "Main advanced during rotation."
              exit 0
            fi
            replacement="$(gh api --method GET "$repository/actions/caches" \
              -f ref="$ref" -f key="$current_key" -F per_page=100 \
              | jq -e --arg ref "$ref" --arg key "$current_key" \
                'any(.actions_caches[]; .ref == $ref and .key == $key and .size_in_bytes > 0)')"
            [[ "$replacement" == true ]]
            gh api --method DELETE "$repository/actions/caches/$cache_id" --silent
            echo "Retired superseded main macOS dependency cache $cache_id."
          done <<< "$candidates"
