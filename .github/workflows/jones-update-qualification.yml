name: Jones update qualification

on:
  pull_request:
    paths:
      - .github/workflows/jones-update-qualification.yml
      - .github/workflows/artifact-desktop-mac.yml
      - .github/workflows/artifact-cli-linux.yml
      - apps/desktop/src/jones/updates/**
      - apps/desktop/src/boot.ts
      - apps/desktop/vite.config.ts
      - apps/desktop/scripts/main-process-bundle.test.mjs
      - apps/desktop/package.json
      - packages/shared/src/jones/nativeWriterFence*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/client-runtime/src/platform/storageDocument.ts
      - packages/client-runtime/src/platform/storageDocument.test.ts
      - packages/client-runtime/src/platform/persistence.ts
      - packages/client-runtime/src/connection/registry.ts
      - packages/client-runtime/src/connection/registry.test.ts
      - apps/web/src/connection/storage.ts
      - apps/web/src/connection/storage.test.ts
      - apps/mobile/src/connection/catalog-store.ts
      - apps/mobile/src/connection/storage.ts
      - apps/mobile/src/connection/storage.test.ts
      - apps/desktop/src/app/DesktopConnectionCatalogStore.ts
      - apps/desktop/src/app/DesktopConnectionCatalogStore.test.ts
      - apps/desktop/src/app/DesktopConnectionCompatibilityHintStore.ts
      - apps/desktop/src/app/DesktopConnectionCompatibilityHintStore.test.ts
      - apps/desktop/src/app/DesktopConnectionCompatibilityHintStore.fixture.ts
      - apps/desktop/src/ipc/methods/connectionCatalog.ts
      - apps/desktop/src/ipc/channels.ts
      - apps/desktop/src/ipc/DesktopIpcHandlers.ts
      - apps/desktop/src/preload.ts
      - packages/contracts/src/ipc.ts
      - apps/web/src/components/settings/ConnectionsSettings.tsx
      - apps/web/src/jones/fleetUpdates/**
      - apps/server/src/jones/updates/**
      - apps/server/src/jones/cloud/qualifiedStartup.ts
      - apps/web/src/jones/updates/**
      - apps/web/src/versionSkew.ts
      - scripts/stamp-jones-build*
      - scripts/build-desktop-artifact.ts
      - scripts/jones/updates/**
      - scripts/jones/boundary/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jones-update-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Jones update regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Qualify affected update and recovery behavior
        run: >-
          vp test run
          apps/web/src/versionSkew.test.ts
          apps/web/src/jones/updates/versionSkew.test.ts
          apps/web/src/jones/updates/localDesktopUpdate.test.ts
          apps/desktop/src/jones/updates/preloadInstall.test.ts
          apps/desktop/src/jones/updates/JonesDesktopUpdates.test.ts
          apps/desktop/src/jones/updates/jonesNativeHelperSource.test.ts
          apps/web/src/jones/fleetUpdates/blockedHostCommand.test.ts
          apps/web/src/jones/fleetUpdates/sourceCurrency.test.ts
          packages/client-runtime/src/jones/fleetUpdates/updateBridge.test.ts
          packages/contracts/src/jones/fleetUpdates/source.test.ts
          packages/client-runtime/src/platform/storageDocument.test.ts
          packages/client-runtime/src/connection/registry.test.ts
          apps/web/src/connection/storage.test.ts
          apps/mobile/src/connection/storage.test.ts
          apps/desktop/src/app/DesktopConnectionCatalogStore.test.ts
          apps/desktop/src/app/DesktopConnectionCompatibilityHintStore.test.ts
          apps/web/src/jones/fleetUpdates/JonesBlockedHostUpdates.test.tsx
          packages/contracts/src/ipc.test.ts
          apps/desktop/src/jones/updates/jonesMacStaging.test.ts
          apps/server/src/jones/updates/trialGate.test.ts
          apps/server/src/jones/updates/trialStartup.test.ts
          apps/server/src/jones/cloud/qualifiedStartup.test.ts
          scripts/stamp-jones-build.test.ts
          scripts/jones/updates/build-provenance.test.ts
          scripts/build-desktop-artifact.test.ts

      - name: Install virtual display for Chromium startup qualification
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Check startup qualification fixtures
        run: node --test scripts/jones/updates/native-startup-fixture.node-test.mjs

      - name: Qualify Chromium-mode native startup refusal
        run: xvfb-run -a node scripts/jones/updates/native-startup-chromium.mjs

      - name: Verify Jones boundary accounting
        run: node scripts/jones/check-boundary.ts --strict --json
